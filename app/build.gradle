apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

// ---------------------------------------------------------------------------
// Release signing: resolved once at configuration time, never hardcoded.
//
// Precedence: environment variables > root-level `keystore.properties`.
// CI injects the environment variables; local developers may instead create an
// untracked `keystore.properties` (git-ignored) next to `settings.gradle`.
//
// An *incomplete* configuration is not an error: the release build type simply
// keeps its default (unsigned) behaviour, so anybody can build the app without
// the signing secrets. A keystore path that is set but does not exist IS an
// error, because that can only mean a misconfiguration that would silently ship
// unsigned artifacts.
// ---------------------------------------------------------------------------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

// Whitespace is trimmed and empty values are treated as "not set".
def releaseSigningValue = { String envName, String propertyKey ->
    def value = System.getenv(envName)?.trim()
    return value ? value : (keystoreProperties.getProperty(propertyKey)?.trim() ?: '')
}

def releaseStoreFile = releaseSigningValue('ANDROID_KEYSTORE_FILE', 'storeFile')
def releaseStorePassword = releaseSigningValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = releaseSigningValue('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = releaseSigningValue('ANDROID_KEY_PASSWORD', 'keyPassword')

// rootProject.file(...) honours absolute paths as-is and resolves relative paths
// against the repository root, so both work for storeFile.
boolean hasReleaseSigning = false
if (releaseStoreFile) {
    if (!rootProject.file(releaseStoreFile).exists()) {
        throw new GradleException("Release signing is configured, but the keystore file " +
                "'${releaseStoreFile}' (resolved to '${rootProject.file(releaseStoreFile)}') does not exist. " +
                "Point ANDROID_KEYSTORE_FILE, or the 'storeFile' entry of " +
                "'${keystorePropertiesFile}', at an existing keystore.")
    }
    hasReleaseSigning = !!(releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword)
}

if (!hasReleaseSigning) {
    // Kept at info level: this fires on every configuration (IDE sync included), so it
    // must not spam the console of contributors who never sign anything. CI surfaces the
    // same information with an explicit ::warning:: from the release workflow.
    logger.info("Tempo: no release signing configured (set ANDROID_KEYSTORE_FILE / ANDROID_KEYSTORE_PASSWORD / " +
            "ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD, or provide keystore.properties with storeFile / storePassword / " +
            "keyAlias / keyPassword at the repository root) -> release APKs/AABs will be UNSIGNED.")
}

android {
    compileSdk 35
    buildToolsVersion = '35.0.0'

    defaultConfig {
        minSdkVersion 24
        targetSdk 35

        versionCode 26
        versionName '3.9.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

    flavorDimensions += "default"

    productFlavors {
        tempo {
            dimension = "default"
            applicationId 'com.cappielloantonio.tempo'
        }

        notquitemy {
            dimension = "default"
            applicationId "com.cappielloantonio.notquitemy.tempo"
        }

        play {
            dimension = "default"
            applicationId "com.cappielloantonio.play.tempo"
        }
    }

    // Declared in Gradle (not with a post-hoc `apksigner` run) because an AAB
    // MUST already be signed when it is produced: Google Play refuses unsigned
    // bundles, so the bundle task itself needs a signingConfig.
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    namespace 'com.cappielloantonio.tempo'
}

dependencies {
    implementation files('../libs/lib-decoder-ffmpeg-release.aar')

    // AndroidX
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Android Material
    implementation 'com.google.android.material:material:1.10.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:annotations:4.16.0'

    // Media3
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    tempoImplementation 'androidx.media3:media3-cast:1.5.1'
    playImplementation 'androidx.media3:media3-cast:1.5.1'

    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.14'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
}